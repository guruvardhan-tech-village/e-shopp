spring.application.name=expensetracker

# ===== PostgreSQL DataSource =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expensetracker}
spring.datasource.username=${DB_USERNAME:expensetracker}
spring.datasource.password=${DB_PASSWORD:expensetracker}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret-key}
app.jwt.issuer=${JWT_ISSUER:expensetracker}
# Token expiry in milliseconds: 24 hours = 86400000
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
