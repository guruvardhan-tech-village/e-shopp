# ===== Test profile =====
# Used by @DataJpaTest (H2 in-memory) and integration tests (Testcontainers).
#
# @DataJpaTest auto-configures an embedded H2 datasource and ignores this file's
# datasource settings unless you explicitly set @AutoConfigureTestDatabase(replace=NONE).
#
# For full Spring Boot integration tests with Testcontainers, annotate the test class with:
#   @SpringBootTest
#   @ActiveProfiles("test")
#   @Testcontainers
# and declare a static PostgreSQLContainer field annotated with @Container.
# Use @DynamicPropertySource to override the datasource URL/username/password at runtime.

# ===== DataSource (overridden at runtime by @DynamicPropertySource in Testcontainers tests) =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== JWT (test values — not secret) =====
app.jwt.secret=test-secret-key-for-unit-tests-only-must-be-256-bits-long-padding
app.jwt.issuer=expensetracker-test
app.jwt.expiry-ms=3600000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173
